$kind: http-request
description: |-
  Accepts an invite to the club. The caller's status changes to `active` and `joined_at` is set.

  | Status | When |
  | --- | --- |
  | `401` | The token is missing, invalid or expired. |
  | `403` | The caller has not been invited to this club. |
  | `404` | The club does not exist. |
  | `409` | The caller has already joined. |
url: '{{base_url}}/clubs/:club_id/join'
method: POST
pathVariables:
- key: club_id
  value: '{{club_id}}'
  description: The club's numeric ID.
auth:
  type: inherit
  credentials:
    id: 93274e17-223a-49b0-b273-ae92bb3e6ab2
order: 8000
examples: ./.resources/Join Club.resources/examples
