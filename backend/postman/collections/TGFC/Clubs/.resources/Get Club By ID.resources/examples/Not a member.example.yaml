$kind: http-example
name: Not a member
request:
  url: '{{base_url}}/clubs/id/:club_id'
  method: GET
  pathVariables:
  - key: club_id
    value: '{{club_id}}'
    description: The club's numeric ID.
response:
  statusCode: 404
  statusText: Not Found
  headers:
  - key: content-type
    value: application/json
  body:
    type: json
    content: |-
      {
        "detail": "You are not a member of this club"
      }
order: 2000
