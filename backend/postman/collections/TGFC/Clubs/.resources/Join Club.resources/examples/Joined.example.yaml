$kind: http-example
name: Joined
request:
  url: '{{base_url}}/clubs/:club_id/join'
  method: POST
  pathVariables:
  - key: club_id
    value: '{{club_id}}'
    description: The club's numeric ID.
response:
  statusCode: 200
  statusText: OK
  headers:
  - key: content-type
    value: application/json
  body:
    type: json
    content: |-
      {
        "name": "The Greatest Film Club",
        "description": "Weekly movie nights with friends",
        "id": 1,
        "normalized_name": "the-greatest-film-club",
        "member": {
          "club_id": 1,
          "user_id": "0199a1b2-9f8e-7d6c-8b5a-4f3e2d1c0b9a",
          "role": "member",
          "status": "active",
          "invited_at": "2026-10-19T18:30:00.000000Z",
          "joined_at": "2026-10-19T18:30:00.000000Z"
        }
      }
order: 1000
