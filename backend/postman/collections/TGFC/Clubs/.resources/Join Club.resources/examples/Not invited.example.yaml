$kind: http-example
name: Not invited
request:
  url: '{{base_url}}/clubs/:club_id/join'
  method: POST
  pathVariables:
  - key: club_id
    value: '{{club_id}}'
    description: The club's numeric ID.
response:
  statusCode: 403
  statusText: Forbidden
  headers:
  - key: content-type
    value: application/json
  body:
    type: json
    content: |-
      {
        "detail": "You have not been invited to this club"
      }
order: 2000
