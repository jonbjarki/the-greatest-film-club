$kind: http-example
name: Voting closed
request:
  url: '{{base_url}}/movie-nights/:movie_night_id/movies/:movie_id/vote'
  method: POST
  pathVariables:
  - key: movie_night_id
    value: '{{movie_night_id}}'
    description: The movie night's numeric ID.
  - key: movie_id
    value: '{{movie_id}}'
    description: TMDB ID of a movie in this movie night.
response:
  statusCode: 403
  statusText: Forbidden
  headers:
  - key: content-type
    value: application/json
  body:
    type: json
    content: |-
      {
        "detail": "Voting for this movie night has closed"
      }
order: 3000
