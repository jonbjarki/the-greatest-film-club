$kind: http-example
name: Voted
request:
  url: '{{base_url}}/movie-nights/:movie_night_id/movies/:movie_id/vote'
  method: POST
  pathVariables:
  - key: movie_night_id
    value: '{{movie_night_id}}'
    description: The movie night's numeric ID.
  - key: movie_id
    value: '{{movie_id}}'
    description: TMDB ID of a movie in this movie night.
response:
  statusCode: 200
  statusText: OK
  headers:
  - key: content-type
    value: application/json
  body:
    type: json
    content: |-
      {
        "movie_night_movie_id": 1,
        "user_id": "0199a1b2-3c4d-7e5f-8a9b-0c1d2e3f4a5b",
        "created_at": "2026-10-19T18:30:00.000000Z"
      }
order: 1000
