$kind: http-example
name: Not a member
request:
  url: '{{base_url}}/movie-nights/club/:club_id'
  method: GET
  pathVariables:
  - key: club_id
    value: '{{club_id}}'
    description: The club's numeric ID.
response:
  statusCode: 403
  statusText: Forbidden
  headers:
  - key: content-type
    value: application/json
  body:
    type: json
    content: |-
      {
        "detail": "User is not a member of this club"
      }
order: 2000
