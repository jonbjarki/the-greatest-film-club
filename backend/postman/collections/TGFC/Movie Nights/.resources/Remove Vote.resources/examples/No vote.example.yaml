$kind: http-example
name: No vote
request:
  url: '{{base_url}}/movie-nights/:movie_night_id/movies/:movie_id/vote'
  method: DELETE
  pathVariables:
  - key: movie_night_id
    value: '{{movie_night_id}}'
    description: The movie night's numeric ID.
  - key: movie_id
    value: '{{movie_id}}'
    description: TMDB ID of a movie in this movie night.
response:
  statusCode: 404
  statusText: Not Found
  headers:
  - key: content-type
    value: application/json
  body:
    type: json
    content: |-
      {
        "detail": "Vote not found"
      }
order: 2000
