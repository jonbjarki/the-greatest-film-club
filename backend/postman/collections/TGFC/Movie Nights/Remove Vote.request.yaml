$kind: http-request
description: |-
  Removes the caller's vote for a movie. Votes can't be removed after the deadline.

  | Status | When |
  | --- | --- |
  | `401` | The token is missing, invalid or expired. |
  | `403` | The caller is not an active member, or the voting deadline has passed. |
  | `404` | The movie night, the movie in it, or the caller's vote does not exist. |
url: '{{base_url}}/movie-nights/:movie_night_id/movies/:movie_id/vote'
method: DELETE
pathVariables:
- key: movie_night_id
  value: '{{movie_night_id}}'
  description: The movie night's numeric ID.
- key: movie_id
  value: '{{movie_id}}'
  description: TMDB ID of a movie in this movie night.
auth:
  type: inherit
  credentials:
    id: 93274e17-223a-49b0-b273-ae92bb3e6ab2
order: 7000
examples: ./.resources/Remove Vote.resources/examples
