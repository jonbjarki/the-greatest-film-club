$kind: http-request
description: |-
  Creates a movie night in a club. Only active owners and admins can do this.

  | Field | Rules |
  | --- | --- |
  | `club_id` | Required. The club's ID. |
  | `title` | Required. 4-40 characters, unique within the club. |
  | `description` | Optional. 4-200 characters. |
  | `deadline` | Optional. ISO 8601 datetime when voting closes. A value without a timezone is treated as UTC. |

  | Status | When |
  | --- | --- |
  | `401` | The token is missing, invalid or expired. |
  | `403` | The caller is not an active owner or admin of the club. |
  | `404` | The club does not exist. |
  | `409` | The club already has a movie night with this title. |
  | `422` | A field fails validation. |
url: '{{base_url}}/movie-nights/'
method: POST
body:
  type: json
  content: |-
    {
      "club_id": {{club_id}},
      "title": "Ghibli Night",
      "description": "Pick your favourite Studio Ghibli film",
      "deadline": "2026-10-24T20:00:00Z"
    }
auth:
  type: inherit
  credentials:
    id: 93274e17-223a-49b0-b273-ae92bb3e6ab2
order: 1000
examples: ./.resources/Create Movie Night.resources/examples
