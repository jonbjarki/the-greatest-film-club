$kind: http-example
name: Wrong credentials
request:
  url: '{{base_url}}/auth/login'
  method: POST
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
  - key: content-type
    value: application/json
  body:
    type: json
    content: |-
      {
        "detail": "Incorrect username or password"
      }
order: 2000
